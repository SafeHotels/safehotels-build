<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Search Safe Hotels | SafeHotels.ai</title>
<link rel="canonical" href="https://safehotels.ai/search.html">
<script>
  // This page has moved. Send visitors to the main search, keeping what they searched for.
  (function () {
    var p = new URLSearchParams(window.location.search);
    var out = new URLSearchParams();
    var loc = p.get('city') || p.get('location');
    if (loc) out.set('location', loc);
    ['checkin', 'checkout', 'guests'].forEach(function (k) { if (p.get(k)) out.set(k, p.get(k)); });
    var q = out.toString();
    window.location.replace('/search.html' + (q ? '?' + q : ''));
  })();
</script>
</head>
<body>
<p>This page has moved. <a href="/search.html">Go to hotel search</a>.</p>
</body>
</html>
